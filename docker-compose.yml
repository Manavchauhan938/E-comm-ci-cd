services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecomm
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  server:
    build: ./server
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecomm?schema=public
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: docker-access-secret-change-me-32chars
      JWT_REFRESH_SECRET: docker-refresh-secret-change-me-32chars
      COOKIE_SECURE: 'false'
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_replace}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_replace}
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_replace}
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  pgdata:
