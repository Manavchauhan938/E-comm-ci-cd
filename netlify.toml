# Entire app on Netlify: Vite SPA + Express API (Netlify Functions)
# Set DATABASE_URL (Neon/Supabase) + JWT secrets in Netlify site env

[build]
  command = "npm install --legacy-peer-deps && npm run prisma:generate --workspace=server && npm run build --workspace=client"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "/api"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Only Prisma stays external (native engines); everything else is bundled
  external_node_modules = ["@prisma/client", "prisma"]

[functions."api"]
  included_files = [
    "server/prisma/**",
    "node_modules/.prisma/**",
    "node_modules/@prisma/client/**"
  ]

# Proxy /api/* to the Express Netlify Function (:splat kept for path rewrite in api.js)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
