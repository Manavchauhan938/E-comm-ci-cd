# Netlify — frontend (React/Vite client)
# Backend (Express + Postgres) is NOT hosted on Netlify; see DEPLOY.md

[build]
  base = "."
  command = "npm install --legacy-peer-deps && npm run build --workspace=client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing — send all paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
