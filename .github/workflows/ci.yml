name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecomm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecomm_test?schema=public

      - name: Migrate
        working-directory: server
        run: npx prisma migrate deploy || npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecomm_test?schema=public

      - name: Backend tests
        working-directory: server
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecomm_test?schema=public
          JWT_ACCESS_SECRET: test-access-secret-min-32-characters
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-characters
          NODE_ENV: test

      - name: Frontend tests
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api
