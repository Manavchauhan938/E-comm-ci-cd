name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecomm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecomm_test?schema=public

      - name: Migrate
        working-directory: server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecomm_test?schema=public

      - name: Backend tests
        run: npm test --workspace=server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecomm_test?schema=public
          JWT_ACCESS_SECRET: test-access-secret-min-32-characters
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-characters
          NODE_ENV: test
          CLIENT_URL: http://localhost:5173

      - name: Frontend tests
        run: npm test --workspace=client

      - name: Build client
        run: npm run build --workspace=client
        env:
          VITE_API_URL: /api
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

  docker:
    name: Build & push Docker images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Image name prefix
        id: meta
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ecomm" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-api:latest
            ${{ steps.meta.outputs.prefix }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-client:latest
            ${{ steps.meta.outputs.prefix }}-client:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-netlify:
    name: Deploy app to Netlify (SPA + API)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check Netlify secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Missing NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID"
            exit 1
          fi

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build client
        run: npm run build --workspace=client
        env:
          VITE_API_URL: /api
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy SPA + Functions to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          CI: true
        run: |
          set -euo pipefail
          mkdir -p .netlify
          printf '{"siteId":"%s"}\n' "$NETLIFY_SITE_ID" > .netlify/state.json
          # Temp non-workspace root avoids Netlify CLI monorepo prompts.
          # Omit build.command — client + Prisma already built in this job.
          STAGE=$(mktemp -d)
          cp -a client/dist "$STAGE/dist"
          cp -a netlify "$STAGE/netlify"
          cp -a server "$STAGE/server"
          cp -a node_modules "$STAGE/node_modules"
          cat > "$STAGE/netlify.toml" <<'EOF'
          [build]
            publish = "dist"
            functions = "netlify/functions"

          [build.environment]
            NODE_VERSION = "20"
            VITE_API_URL = "/api"

          [functions]
            directory = "netlify/functions"
            node_bundler = "esbuild"
            external_node_modules = [
              "@prisma/client",
              "prisma",
              "bcryptjs",
              "pino",
              "pino-pretty",
              "pino-http",
              "stripe",
              "express",
              "serverless-http"
            ]

          [functions."api"]
            included_files = [
              "server/prisma/**",
              "server/src/**",
              "node_modules/.prisma/**",
              "node_modules/@prisma/client/**"
            ]

          [[redirects]]
            from = "/api/*"
            to = "/.netlify/functions/api/:splat"
            status = 200
            force = true

          [[redirects]]
            from = "/*"
            to = "/index.html"
            status = 200

          [[headers]]
            for = "/*"
            [headers.values]
              X-Frame-Options = "DENY"
              X-Content-Type-Options = "nosniff"
              Referrer-Policy = "strict-origin-when-cross-origin"
          EOF
          # Strip leading spaces from heredoc so TOML parses cleanly
          sed -i 's/^          //' "$STAGE/netlify.toml"
          cd "$STAGE"
          printf '{"name":"ecomm-netlify-deploy","private":true,"type":"module"}\n' > package.json
          netlify deploy --prod \
            --dir=dist \
            --functions=netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message "ci ${GITHUB_SHA}"
